name: Linux release

on:
  push:
    tags: ['v*-linux']

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: |
          npm run build:main
          npm run build:renderer
          npx electron-builder --linux AppImage --x64 --publish never

      - name: Stable copy
        run: cp release/wmux-*-x86_64.AppImage release/wmux-x86_64.AppImage

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s extglob
          gh release create "$GITHUB_REF_NAME" release/wmux-*-x86_64.AppImage release/wmux-x86_64.AppImage \
            --repo michaelhuntergray/wmux --title "$GITHUB_REF_NAME" --notes "Linux AppImage (x64)"
